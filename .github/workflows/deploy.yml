name: Deploy Backend then Frontend

# Deploys only after the "Server tests" workflow passes for a push to master
on:
  workflow_run:
    workflows:
      - Server tests
    types:
      - completed
    branches:
      - master

jobs:
  deploy-backend:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Render
        run: |
          echo "Triggering Render deployment..."
          response=$(curl -s -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          http_code="${response: -3}"

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "✅ Render deployment triggered successfully"
            echo "⏳ Waiting for deployment to complete..."
            sleep 60  # Wait 60 seconds for deployment to start
          else
            echo "❌ Failed to trigger Render deployment. HTTP code: $http_code"
            exit 1
          fi

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install dependencies and deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm ci --prefix client

          echo "Installing Vercel CLI..."
          npm install -g vercel@latest

          echo "Deploying to Vercel..."
          vercel --token "${{ secrets.VERCEL_TOKEN }}" --prod
